<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dana Outlook DEV</title>
  <style>
    body{font-family:Segoe UI,Arial,sans-serif;margin:20px;color:#1f1f1f}
    h1{color:#106ebe;margin:0 0 12px}
    .status{color:#555;font-size:16px}.error{color:#a4262c}
    button{margin-top:12px;padding:7px 14px}
    .spinner{display:inline-block;width:13px;height:13px;margin-right:8px;border:2px solid #c7e0f4;border-top-color:#106ebe;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <h1>Dana</h1>
  <p id="status" class="status"><span class="spinner" aria-hidden="true"></span>Drafting reply…</p>
  <button id="retry" type="button" hidden>Retry</button>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/Office.js"></script>
  <script>
    (function () {
      var ENDPOINT = 'https://dana-dev-api.ar-tech.cloud/dana/draft-reply';
      var currentContext = null;
      var running = false;

      function htmlToText(html) {
        var doc = new DOMParser().parseFromString(html || '', 'text/html');
        return (doc.body && doc.body.textContent || '').replace(/\u00a0/g, ' ').replace(/\r\n?/g, '\n').trim();
      }
      function escapeHtml(value) {
        return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      }
      function proposalHtml(proposal) {
        var source = String(proposal.proposedReply || '');
        var marker = /\[\[HUMAN_INPUT:([\s\S]*?)\]\]/g;
        if (proposal.needsHumanInput === true && !marker.test(source)) {
          var instruction = String(proposal.uncertaintyReason || 'Confirm the missing information before sending.').trim();
          var inlineMarker = '[[HUMAN_INPUT:Human input required — ' + instruction + ']]';
          var closing = /(^|\n)(?=Best regards|Kind regards|Regards|Sincerely|Thank you)/i;
          source = closing.test(source)
            ? source.replace(closing, '$1' + inlineMarker + '\n\n')
            : source + '\n\n' + inlineMarker;
        }
        marker.lastIndex = 0;
        var cursor = 0, found = false, html = '', match;
        while ((match = marker.exec(source)) !== null) {
          found = true;
          html += escapeHtml(source.slice(cursor, match.index));
          html += '<span style="color:#c00000;font-weight:600">' + escapeHtml(match[1].trim()) + '</span>';
          cursor = marker.lastIndex;
        }
        html += escapeHtml(source.slice(cursor));
        if (proposal.needsHumanInput === true && !found) throw new Error('Dana could not place the required confirmation in the draft.');
        return '<div>' + html.replace(/\n/g, '<br>') + '</div>';
      }
      function readBody(item) {
        return new Promise(function (resolve, reject) {
          item.body.getAsync(Office.CoercionType.Html, function (result) {
            if (result.status !== Office.AsyncResultStatus.Succeeded) return reject(result.error);
            resolve(htmlToText(result.value));
          });
        });
      }
      function buildContext(item, body) {
        var from = item.from || {};
        return {
          messageId: item.itemId || '', conversationId: item.conversationId || '',
          sender: { displayName: from.displayName || '', emailAddress: from.emailAddress || '', name: from.displayName || '', address: from.emailAddress || '' },
          subject: item.subject || '', body: body || '',
          to: Array.isArray(item.to) ? item.to : [], cc: Array.isArray(item.cc) ? item.cc : [], replyMode: 'replyAll'
        };
      }
      function setDrafting() {
        document.getElementById('status').className = 'status';
        document.getElementById('status').innerHTML = '<span class="spinner" aria-hidden="true"></span>Drafting reply…';
        document.getElementById('retry').hidden = true;
      }
      function setError(message) {
        document.getElementById('status').className = 'error';
        document.getElementById('status').textContent = message || 'Dana could not draft this reply.';
        document.getElementById('retry').hidden = false;
      }
      function openNativeReply(item, proposal) {
        if (!currentContext || item.itemId !== currentContext.messageId) throw new Error('The selected email changed. Please try Dana again on the current email.');
        if (typeof item.displayReplyAllFormAsync !== 'function') throw new Error('Native Outlook Reply is unavailable in this client.');
        var html = proposalHtml(proposal);
        return new Promise(function (resolve, reject) {
          item.displayReplyAllFormAsync(html, function (result) {
            if (result.status !== Office.AsyncResultStatus.Succeeded) return reject(result.error || new Error('Native reply could not be opened.'));
            resolve();
          });
        });
      }
      function generateAndReply() {
        if (running) return;
        var item = Office.context && Office.context.mailbox && Office.context.mailbox.item;
        if (!item) { setError('Open an email, then try Dana again.'); return; }
        running = true; currentContext = null; setDrafting();
        var controller = new AbortController();
        var timer = setTimeout(function () { controller.abort(); }, 20000);
        readBody(item)
          .then(function (body) {
            currentContext = buildContext(item, body);
            return fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(currentContext), signal: controller.signal });
          })
          .then(function (response) { if (!response.ok) throw new Error('Dana could not draft this reply.'); return response.json(); })
          .then(function (proposal) {
            if (!proposal || typeof proposal.proposedReply !== 'string' || !proposal.proposedReply) throw new Error('Dana returned an incomplete draft.');
            return openNativeReply(item, proposal);
          })
          .then(function () { document.getElementById('status').className = 'status'; document.getElementById('status').textContent = 'Reply opened in Outlook.'; })
          .catch(function (error) { setError(error && error.name === 'AbortError' ? 'Dana took too long to respond. Please try again.' : (error && error.message || 'Dana could not draft this reply.')); })
          .finally(function () { clearTimeout(timer); running = false; });
      }

      // Preserved for a future optional scheduling UX. It is intentionally not exposed in the default Dana flow.
      function scheduleInFifteenMinutes(callback) {
        var item = Office.context && Office.context.mailbox && Office.context.mailbox.item;
        var delay = item && item.delayDeliveryTime;
        if (!delay || typeof delay.setAsync !== 'function') { callback(new Error('Delayed delivery is unavailable.')); return; }
        delay.setAsync(new Date(Date.now() + 15 * 60 * 1000), function (result) { callback(result.status === Office.AsyncResultStatus.Succeeded ? null : result.error); });
      }

      Office.onReady(function (info) {
        if (info.host !== Office.HostType.Outlook) { setError('Dana must be opened from Outlook.'); return; }
        var item = Office.context && Office.context.mailbox && Office.context.mailbox.item;
        if (item && item.delayDeliveryTime && typeof item.delayDeliveryTime.setAsync === 'function') {
          document.getElementById('status').className = 'status';
          document.getElementById('status').textContent = 'Review and send this reply using Outlook.';
          return;
        }
        document.getElementById('retry').addEventListener('click', generateAndReply);
        generateAndReply();
      });
    }());
  </script>
</body>
</html>
