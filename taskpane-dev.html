<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dana Outlook DEV</title>
  <style>body{font-family:Segoe UI,Arial,sans-serif;margin:20px;color:#1f1f1f}h1{color:#106ebe;margin-top:0}.status{color:#666}.field{margin:14px 0}.label{font-weight:600;color:#555}.value{white-space:pre-wrap;word-break:break-word;margin-top:4px;background:#f5f5f5;padding:8px;border-radius:4px}.error{color:#a4262c}.mono{font:12px Consolas,monospace}</style>
</head>
<body>
  <h1>Dana DEV — selected email</h1>
  <p id="status" class="status">Reading the selected Outlook item…</p>
  <div id="context"></div>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/Office.js"></script>
  <script>
    (function () {
      function text(value) { return value == null || value === '' ? '(empty)' : String(value); }
      function recipients(list) {
        return Array.isArray(list) && list.length
          ? list.map(function (r) { return (r.displayName ? r.displayName + ' ' : '') + '<' + (r.emailAddress || '') + '>'; }).join('; ')
          : '(none)';
      }
      function htmlToText(html) {
        var doc = new DOMParser().parseFromString(html || '', 'text/html');
        return (doc.body && doc.body.textContent || '').replace(/\u00a0/g, ' ').replace(/\r\n?/g, '\n').trim();
      }
      function show(label, value, extra) {
        var row = document.createElement('div'); row.className = 'field';
        var name = document.createElement('div'); name.className = 'label'; name.textContent = label;
        var val = document.createElement('div'); val.className = 'value' + (extra || ''); val.textContent = text(value);
        row.appendChild(name); row.appendChild(val); document.getElementById('context').appendChild(row);
      }
      function readBody(item) {
        return new Promise(function (resolve, reject) {
          item.body.getAsync(Office.CoercionType.Html, function (result) {
            if (result.status !== Office.AsyncResultStatus.Succeeded) return reject(result.error);
            resolve(htmlToText(result.value));
          });
        });
      }
      function read() {
        var item = Office.context && Office.context.mailbox && Office.context.mailbox.item;
        if (!item) throw new Error('No Outlook item is selected.');
        return readBody(item).then(function (body) {
          var from = item.from || {};
          show('Sender', (from.displayName || '(unknown)') + ' <' + (from.emailAddress || '(unknown)') + '>');
          show('Subject', item.subject);
          show('To', recipients(item.to));
          show('CC', recipients(item.cc));
          show('Body (HTML converted to text)', body, ' body');
          show('Item ID', item.itemId, ' mono');
          show('Conversation / thread ID', item.conversationId || '(not exposed)', ' mono');
          show('Created', item.dateTimeCreated);
          show('Modified', item.dateTimeModified);
          show('Reply All indication', item.cc && item.cc.length ? 'CC present — Reply All would preserve CC.' : 'No CC exposed — Reply may be sufficient.');
          document.getElementById('status').textContent = 'Read-only capture complete. No email was changed.';
        });
      }
      Office.onReady(function (info) {
        if (info.host !== Office.HostType.Outlook) { document.getElementById('status').textContent = 'Not running inside Outlook.'; return; }
        read().catch(function (error) { document.getElementById('status').className = 'error'; document.getElementById('status').textContent = 'Read failed: ' + text(error && error.message || error); });
      });
    }());
  </script>
</body>
</html>
